<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>AgriSmart Preview</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f2f7f3;color:#173122}.login{min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#124326,#55a866);padding:20px}.box,.card{background:#fff;border-radius:16px;padding:22px;box-shadow:0 4px 18px #0001}.box{width:min(400px,100%)}h1{margin-top:8px}input,select{width:100%;padding:12px;margin:6px 0 14px;border:1px solid #ccd8ce;border-radius:9px}.btn{border:0;background:#176b3a;color:#fff;padding:12px 18px;border-radius:9px;font-weight:bold}.full{width:100%}.app{display:none}.nav{background:#123b24;color:#fff;padding:15px;display:flex;gap:8px;flex-wrap:wrap}.nav button{background:#ffffff18;color:#fff;border:0;padding:10px;border-radius:8px}.wrap{max-width:1000px;margin:auto;padding:20px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.card b{font-size:28px;display:block;margin:8px 0}.page{display:none}.page.active{display:block}table{width:100%;border-collapse:collapse}td,th{padding:10px;border-bottom:1px solid #ddd;text-align:left}.danger{background:#ffe5e2;color:#b22;border:0;padding:7px;border-radius:7px}@media(max-width:600px){.grid{grid-template-columns:1fr}.nav{position:sticky;top:0;z-index:3}}
</style></head><body>
<div id="login" class="login"><div class="box"><h1>🌱 AgriSmart</h1><p>Smart Agriculture Preview</p><label>Username</label><input id="username" value="farmer"><label>Password</label><input id="password" type="password" value="farmer123"><button class="btn full" onclick="login()">Login</button><p id="error"></p></div></div>
<div id="app" class="app"><div class="nav"><b>🌱 AgriSmart</b><button onclick="show('home')">🏠 Home</button><button onclick="show('crops')">🌾 Crops</button><button onclick="show('weather')">🌦️ Weather</button><button onclick="show('finance')">💰 Finance</button><button onclick="logout()">🚪 Logout</button></div>
<div class="wrap">
<section id="home" class="page active"><h1>Dashboard</h1><div class="grid"><div class="card">🌾<b id="count">0</b>Crops</div><div class="card">🌡️<b>29°C</b>Temperature</div><div class="card">💧<b>78%</b>Humidity</div></div><br><div class="card"><h2>Farm Status</h2><p>✅ Healthy conditions</p><p>🌧️ Rain chance: 65%</p></div></section>
<section id="crops" class="page"><h1>Crop Management</h1><div class="card"><input id="crop" placeholder="Crop name"><input id="field" placeholder="Field name"><select id="status"><option>Healthy</option><option>Growing</option><option>Needs Attention</option></select><button class="btn" onclick="addCrop()">Add Crop</button></div><br><div class="card"><table><thead><tr><th>Crop</th><th>Field</th><th>Status</th><th></th></tr></thead><tbody id="rows"></tbody></table></div></section>
<section id="weather" class="page"><h1>Weather</h1><div class="grid"><div class="card">🌡️<b>29°C</b>Temperature</div><div class="card">💧<b>78%</b>Humidity</div><div class="card">🌧️<b>65%</b>Rain Chance</div></div></section>
<section id="finance" class="page"><h1>Finance</h1><div class="card"><input id="expense" type="number" placeholder="Expense amount"><button class="btn" onclick="addExpense()">Add Expense</button><h2>Total: ₹<span id="total">0</span></h2></div></section>
</div></div>
<script>
let crops=JSON.parse(localStorage.getItem('previewCrops')||'[]'),total=+(localStorage.getItem('previewTotal')||0);
function login(){if((username.value.trim()==='farmer'&&password.value==='farmer123')||(username.value.trim()==='admin'&&password.value==='admin123')){sessionStorage.login='yes';openApp()}else error.textContent='Invalid login. Use farmer / farmer123'}
function openApp(){login.style.display='none';app.style.display='block';render()}if(sessionStorage.login)openApp();
function logout(){sessionStorage.clear();location.reload()}function show(id){document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active')}
function addCrop(){if(!crop.value.trim()||!field.value.trim())return alert('Enter crop and field');crops.push({c:crop.value,f:field.value,s:status.value});localStorage.setItem('previewCrops',JSON.stringify(crops));crop.value='';field.value='';render()}
function del(i){crops.splice(i,1);localStorage.setItem('previewCrops',JSON.stringify(crops));render()}
function addExpense(){let n=Number(expense.value);if(!n)return alert('Enter amount');total+=n;localStorage.setItem('previewTotal',total);expense.value='';render()}
function render(){count.textContent=crops.length;total=document.getElementById('total').textContent=total;rows.innerHTML=crops.map((x,i)=>`<tr><td>${x.c}</td><td>${x.f}</td><td>${x.s}</td><td><button class="danger" onclick="del(${i})">Delete</button></td></tr>`).join('')||'<tr><td colspan="4">No crops yet</td></tr>'}
</script></body></html>
